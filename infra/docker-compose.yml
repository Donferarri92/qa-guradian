version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: qa-guardian-db
    environment:
      POSTGRES_USER: qabot
      POSTGRES_PASSWORD: qabot_secret
      POSTGRES_DB: qabot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qabot -d qabot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qa-network

  # Redis for job queue
  redis:
    image: redis:7-alpine
    container_name: qa-guardian-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qa-network

  # Backend API
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: qa-guardian-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://qabot:qabot_secret@postgres:5432/qabot
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qa-network
    restart: unless-stopped

  # Frontend Dashboard
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    container_name: qa-guardian-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - qa-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  qa-network:
    driver: bridge
